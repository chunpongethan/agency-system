# The 保易通助手 建議書 flow, as data. The worker runs these steps in order.
# Mapped against the real mini-program on 2026-10-21 (飛揚·88, 30 F, USD 50,000, 2 yrs).
#
# Actions:
#   focus              bring a window to the front (title regex)
#   click              find templates/<template>.png on screen and click its centre
#                      (offset = [dx, dy] clicks relative to it, e.g. the input right of a label)
#   click_at           click at = [x, y] relative to the focused window
#   scroll             wheel at = [x, y] (window-relative) by amount (negative = down)
#   paste / type       Chinese via clipboard / ASCII keystrokes
#   clear, key, wait, wait_for
#   wait_ready         poll until pending_template is no longer on the top card
#   copy_link_download click template (复制下载链接), read the URL from the clipboard,
#                      download the PDF; ends the flow
#
# Placeholders: {age} {gender} {gender_label} {product} {product_simplified}
# {product_search} {premium} {term_years} {currency}.
# Window-relative coordinates assume the 保易通助手 window size stays as calibrated (535×984).

# --- get to 建議書管理 -------------------------------------------------------
[[step]]
action = "focus"
title = "^保易通助手$"               # the mini-program's own window (not the 微信 panel)

[[step]]
action = "click"
template = "nav_home"                # house icon, shown on inner pages (e.g. the last share page)
optional = true
timeout = 2
after = 3

[[step]]
action = "click"
template = "workbench_tab"           # 工作台 tab
optional = true
timeout = 5
after = 2

[[step]]
action = "click"
template = "jianyishu"               # 建議書 → 建議書管理 list
after = 4

[[step]]
action = "click"
template = "new_proposal"            # floating 新建 button
timeout = 20
after = 3

# --- product -------------------------------------------------------------
[[step]]
action = "click"
template = "product_search"          # 请输入产品名称搜索

[[step]]
action = "paste"
text = "{product_search}"            # Simplified leading name, e.g. 飞扬
after = 2.5

[[step]]
action = "click_at"
at = [205, 345]                      # first search result
note = "first product result"
after = 4

# --- insured (受保人信息) ----------------------------------------------------
[[step]]
action = "wait_for"
template = "label_name"
timeout = 20
after = 2

[[step]]
action = "click"
template = "label_name"              # 姓名 → input on the right
offset = [396, 0]

[[step]]
action = "paste"
text = "vip"                         # placeholder — never a real client name

[[step]]
action = "click"
template = "gender_{gender}"         # 男 / 女

[[step]]
action = "click"
template = "label_age"               # 投保年龄 → input on the right
offset = [339, 0]

[[step]]
action = "type"
text = "{age}"

# --- product details (產品信息) ---------------------------------------------
[[step]]
action = "scroll"
at = [268, 700]
amount = -5
after = 1.5

[[step]]
action = "click"
template = "label_term"              # 缴付年期 → opens a picker
offset = [395, 0]
after = 1.5

[[step]]
action = "click"
template = "term_{term_years}"       # e.g. 2年 in the picker wheel
timeout = 5

[[step]]
action = "click"
template = "picker_confirm"          # 确认

[[step]]
action = "click"
template = "label_currency"          # 保单货币 → opens a picker
offset = [395, 0]
after = 1.5

[[step]]
action = "click"
template = "currency_{currency}"     # 美元 / 港元 / 人民币
timeout = 5

[[step]]
action = "click"
template = "picker_confirm"

[[step]]
action = "click"
template = "label_premium"           # 年缴保费 → input on the right
offset = [355, 0]

[[step]]
action = "type"
text = "{premium}"

[[step]]
action = "click"
template = "submit"                  # 提交
after = 2

[[step]]
action = "click"
template = "submit_ok"               # 提交成功 → 我知道了
timeout = 15
after = 3

# --- wait for 保易通's robot, generate the PDF, copy its link ---------------------
# After 提交 the list shows the new card on top (未生成 = no PDF yet). Open it; while the
# robot works it says 機器人處理中. When ready the 生成方案 button appears at the bottom.
[[step]]
action = "click_at"
at = [200, 340]                      # open the newest (top) card's detail page
note = "open the new proposal"
after = 4

[[step]]
action = "wait_ready"
ready_template = "gen_plan"          # 生成方案 — only shown once 智能解讀 is ready
interval = 30
timeout = 1200
refresh = [[36, 52], [200, 340]]     # back to the list, reopen the top card

[[step]]
action = "click"
template = "gen_plan"
after = 2

[[step]]
action = "click"
template = "plan_traditional"        # 保險公司建議書 (傳統) — the insurer-format PDF
after = 6

[[step]]
action = "click"
template = "get_file"                # 文件詳情 → 獲取文件 (share page)
timeout = 30
after = 3

# 复制下载链接 copies three lines: viewer link, file name, summary. The link opens 保易通's
# web PDF viewer, not the file itself, so this final download step still needs a
# decision (see README "Getting the PDF").
[[step]]
action = "copy_link_download"
template = "share_copy_link"         # 复制下载链接
timeout = 30
