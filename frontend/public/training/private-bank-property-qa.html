<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>私行房产收益方案问答特训</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 承瑞金：暖金底 + 深棕字；每个模块一个识别色。单一亮色主题。
   版式：手机竖屏一屏一卡，桌面居中成手机宽度的栏。 */
:root{
  --ground:#F7EEDC; --paper:#FFFBF3; --ink:#3B220F; --muted:#6E5238;
  --gold:#C9862E; --gold-deep:#8A5200; --line:#E7D5B2;
  --brown:#5A2E12; --brown-t:#F3E7D8;
  --ci:#A8261A; --ci-t:#FBEAE4;
  --med:#2F6B1F; --med-t:#EAF2DC;
  --goldm:#8A5200; --goldm-t:#FCEFCC;
  --slate:#4B3F35; --slate-t:#EEE7DE;
  --orange:#B4470E; --orange-t:#FDE9DA;
  --red:#7A1F1F; --red-t:#F6E3E1;
  --teal:#1F5F6B; --teal-t:#E1EFF1; --plum:#6A2C6B; --plum-t:#F3E6F2;
  --ok:#2F6B1F; --bad:#A8261A;
  --display:"Noto Serif SC","Songti SC","SimSun",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ground)}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(90,46,18,.12)}}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- 首页 ---------- */
.home{padding:28px 20px 32px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand img{width:88px;height:auto}
.tag{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--gold-deep);border:1px solid var(--gold);border-radius:999px;padding:3px 12px}
.hero{display:flex;flex-direction:column;gap:10px}
.hero .kicker{font-size:14px;font-weight:700;color:var(--gold-deep);letter-spacing:.2em}
.hero h1{font-family:var(--display);font-weight:900;font-size:38px;line-height:1.2;color:var(--brown)}
.hero h1 em{font-style:normal;color:var(--ci)}
.hero h1 b{color:var(--med)}
.hero p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat strong{display:block;font-size:24px;font-weight:900;color:var(--gold-deep);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.how{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.how h2{font-size:15px;color:var(--brown)}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;min-height:48px}
.btn-primary{background:var(--brown);color:#FFE7B8}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--brown)}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mods{display:flex;flex-direction:column;gap:8px}
.mods h2{font-size:15px;color:var(--brown);margin-bottom:2px}
.mod{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px}
.mod .no{flex-shrink:0;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;font-variant-numeric:tabular-nums}
.mod .nm{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mod .nm strong{font-size:15px}
.mod .nm span{font-size:12px;color:var(--muted)}
.mod .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mod .done{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--med);background:var(--med-t);border-radius:999px;padding:3px 10px;white-space:nowrap}
.mod.is-done{border-color:#B9D3A6}
.mod.is-done .no{box-shadow:0 0 0 3px var(--med-t)}
.reset{align-self:center;background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px;font-weight:700;padding:8px 18px;min-height:40px}
.reset.armed{border-color:var(--red);color:var(--red);background:var(--red-t)}
.donebar{font-size:13px;font-weight:700;color:var(--brown);margin:0 0 4px}
.chip .tick{margin-left:6px}
.finish{margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--med-t);color:var(--med);border-radius:16px;padding:16px}
.finish strong{font-size:17px}
.finish span{font-size:13px;color:var(--ink)}
.foot{font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}

/* ---------- 顶栏 ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--ground);display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{background:var(--line)}
.bar .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.chip{align-self:flex-start;font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:2px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transition:width .25s}
.bar .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- 问答卡 ---------- */
.stage{flex:1;padding:16px 16px 8px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.qhead{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--accent)}
.qlabel{font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--accent)}
.qtext{font-family:var(--display);font-weight:900;font-size:23px;line-height:1.45;color:var(--ink)}
.reveal{margin:0 18px 18px;border:1.5px dashed var(--accent);background:var(--tint);color:var(--accent);border-radius:14px;padding:14px;font-weight:700;min-height:52px}
.ans{border-top:1px solid var(--line);padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.sec-l{font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--muted);margin-bottom:4px}
.atext{white-space:pre-line;font-size:16px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys span{font-size:13px;font-weight:700;background:var(--tint);color:var(--accent);border-radius:8px;padding:3px 10px}
.eg{background:var(--goldm-t);border-radius:14px;padding:12px 14px}
.eg .sec-l{color:var(--gold-deep)}
.eg p{margin:0;white-space:pre-line;font-size:14.5px;line-height:1.7;font-variant-numeric:tabular-nums}
.trap{display:flex;gap:10px;background:#FFF1EC;border:1px solid #F2C9BB;border-radius:14px;padding:12px 14px}
.trap svg{flex-shrink:0;margin-top:2px}
.trap p{margin:0;font-size:14.5px;color:#7A1F1F}
.trap strong{display:block;font-size:12px;letter-spacing:.15em;margin-bottom:2px}
.hint{text-align:center;font-size:12px;color:var(--muted)}

/* ---------- 底栏 ---------- */
.nav{position:sticky;bottom:0;background:var(--ground);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* ---------- 小测 ---------- */
.quiz{display:flex;flex-direction:column;gap:14px}
.quiz-top{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;border-top:6px solid var(--accent)}
.quiz-top h2{font-family:var(--display);font-size:22px;color:var(--ink)}
.quiz-top p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.qq{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.qq h3{font-size:16px;line-height:1.5}
.qq h3 span{color:var(--gold-deep);font-variant-numeric:tabular-nums;margin-right:6px}
.opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px;display:flex;gap:10px;align-items:flex-start}
.opt b{flex-shrink:0;width:22px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:#EEF6E6}
.opt.right b{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#FBEDEA}
.opt.wrong b{color:var(--bad)}
.opt[disabled]{cursor:default}
.expl{font-size:14px;border-radius:10px;padding:10px 12px;background:var(--brown-t)}
.expl strong{margin-right:4px}
.score{background:var(--brown);color:#FFE7B8;border-radius:18px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.score strong{font-size:44px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:#fff}
.score p{margin:0}

/* ---------- 目录抽屉 ---------- */
.drawer{position:fixed;inset:0;z-index:20;background:rgba(59,34,15,.45);display:flex;justify-content:center}
.drawer .panel{width:100%;max-width:480px;margin-top:auto;background:var(--ground);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:8px}
.drawer .ph{display:flex;align-items:center;justify-content:space-between}
.drawer .ph h2{font-size:17px;color:var(--brown)}

/* ---------- 审阅模式 ---------- */
.review{padding:16px;display:flex;flex-direction:column;gap:18px}
.rv-head{display:flex;flex-direction:column;gap:10px}
.rv-head h1{font-family:var(--display);font-size:24px;color:var(--brown)}
.rv-head p{margin:0;font-size:14px;color:var(--muted)}
.rv-mod{display:flex;flex-direction:column;gap:12px}
.rv-mod > h2{font-size:18px;display:flex;align-items:center;gap:8px}
.rv-mod > h2 .no{width:30px;height:30px;border-radius:8px;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.rv-card .qtext{font-size:19px}
.rv-quiz{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14.5px}
.rv-quiz ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.rv-quiz .ok{color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:30}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.hero h1{font-size:32px}.qtext{font-size:21px}}
</style>
</head>

      <p>每张卡是一个真实的客户问题。先自己想答案，再点开参考答案、要点和踩坑提醒。每个模块后有 3 道小测。</p>

      o: ["这个方案保本保息", "收益率 8.9% 是保证的", "持有到期、发行人不违约可取回本金；但有五大风险，须先做适合性分析", "银行不会要求追加保证金"], a: 2,
      x: "永不对客户说「保本」或保证收益。" },
    { q: "二级资本债可以推荐给谁？",
      o: ["所有客户", "已确认资格的专业投资者", "只要客户同意即可", "只限企业客户"], a: 1,
      x: "二级资本债属损失吸收产品，未完成专业投资者资格确认不得下单。" },
    { q: "关于杠杆水平，以下哪项正确？",
      o: ["由顾问按最高收益决定", "由银行决定", "由客户了解追保机制后自行选择并书面确认", "一律用尽可借额"], a: 2,
      x: "不得替客户决定杠杆水平。" }
  ]
};

</script>
<script>
(function(){
  var M = window.MODULES, C = window.CARDS, Q = window.QUIZ, P = window.PRODUCTS;
  var colorOf = {brown:["--brown","--brown-t"],ci:["--ci","--ci-t"],med:["--med","--med-t"],gold:["--goldm","--goldm-t"],slate:["--slate","--slate-t"],orange:["--orange","--orange-t"],red:["--red","--red-t"],teal:["--teal","--teal-t"],plum:["--plum","--plum-t"]};
  function mod(id){ for(var i=0;i<M.length;i++) if(M[i].id===id) return M[i]; }
  function acc(m){ return "var("+colorOf[m.color][0]+")"; }
  function tint(m){ return "var("+colorOf[m.color][1]+")"; }
  function el(tag, attrs, kids){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){ if(k==="text") e.textContent=attrs[k]; else if(k==="style") e.setAttribute("style",attrs[k]); else e.setAttribute(k,attrs[k]); }
    (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  var $ = function(id){ return document.getElementById(id); };

  /* 学习流程：每个模块的卡片 → 模块小测 */
  var FLOW = [];
  M.forEach(function(m){
    C.forEach(function(c,i){ if(c.m===m.id) FLOW.push({t:"card",i:i,m:m.id}); });
    if(Q[m.id]) FLOW.push({t:"quiz",m:m.id});
  });
  var KEY="ht-prop-pos", pos = 0, seen = {};
  try{ var s=parseInt(localStorage.getItem(KEY),10); if(s>=0 && s<FLOW.length) pos=s; }catch(e){}
  var DKEY=KEY+"-done", done={};
  try{ done=JSON.parse(localStorage.getItem(DKEY)||"{}")||{}; }catch(e){ done={}; }
  function markDone(mid){ if(done[mid]) return; done[mid]=true; try{ localStorage.setItem(DKEY, JSON.stringify(done)); }catch(e){} refreshLists(); toast("✓ "+mod(mid).name+" 已完成"); }
  function save(){ try{ localStorage.setItem(KEY, String(pos)); }catch(e){} }

  /* ---------- 首页 ---------- */
  var nQuiz = 0; for(var k in Q) nQuiz++;
  [[M.length-1,"个模块"],[C.length,"张问答卡"],[nQuiz,"组小测"]].forEach(function(s){
    $("stats").appendChild(el("div",{class:"stat"},[el("strong",{text:String(s[0])}),el("span",{text:s[1]})]));
  });
  function modList(container, onPick){
    container.innerHTML="";
    M.forEach(function(m){
      var n=C.filter(function(c){return c.m===m.id;}).length;
      var b=el("button",{class:"mod"+(done[m.id]?" is-done":""),type:"button"},[
        el("span",{class:"no",style:"background:"+acc(m),text:m.no}),
        el("span",{class:"nm"},[el("strong",{text:m.name}),el("span",{text:m.sub})]),
        done[m.id] ? el("span",{class:"done",text:"✓ 已完成"}) : el("span",{class:"ct",text:n+" 张"+(Q[m.id]?" · 小测":"")})
      ]);
      b.addEventListener("click",function(){ onPick(m.id); });
      container.appendChild(b);
    });
  }
  function refreshLists(){
    modList($("home-mods"), startAt);
    modList($("drawer-mods"), function(mid){ closeDrawer(); startAt(mid); });
    var k=0; M.forEach(function(m){ if(done[m.id]) k++; });
    $("donebar").textContent = k ? ("已完成 "+k+" / "+M.length+" 个模块"+(k===M.length?"，可以挑战结业测验":"")) : "";
  }
  function startAt(mid){
    for(var i=0;i<FLOW.length;i++) if(FLOW[i].m===mid){ pos=i; break; }
    show("learn");
  }
  refreshLists();
  updStart();

  /* ---------- 重置进度：点两次确认 ---------- */
  var resetTimer=null;
  $("btn-reset").addEventListener("click",function(){
    var b=$("btn-reset");
    if(!b.classList.contains("armed")){
      b.classList.add("armed"); b.textContent="再点一次，清除全部进度";
      resetTimer=setTimeout(function(){ b.classList.remove("armed"); b.textContent="重置学习进度"; },4000);
      return;
    }
    clearTimeout(resetTimer);
    done={}; seen={}; pos=0;
    try{ localStorage.removeItem(DKEY); localStorage.removeItem(KEY); }catch(e){}
    b.classList.remove("armed"); b.textContent="重置学习进度";
    refreshLists(); updStart(); toast("已重置，可以从头开始");
  });

  /* ---------- 视图切换 ---------- */
  function show(v){
    $("v-home").hidden = v!=="home";
    $("v-learn").hidden = v!=="learn" && v!=="final";
    $("v-review").hidden = v!=="review";
    if(v==="learn") render();
    if(v==="final") renderFinal();
    if(v==="review"){ renderReview(); if(location.hash!=="#review") history.replaceState(null,"","#review"); }
    else if(location.hash) history.replaceState(null,"",location.pathname+location.search);
    window.scrollTo(0,0);
  }
  $("btn-start").addEventListener("click",function(){ show("learn"); });
  $("btn-final").addEventListener("click",function(){ show("final"); });
  $("btn-review").addEventListener("click",function(){ show("review"); });
  $("btn-home").addEventListener("click",function(){ show("home"); });
  $("btn-home2").addEventListener("click",function(){ show("home"); });

  /* ---------- 卡片 ---------- */
  function trapBox(text){
    return el("div",{class:"trap"},[
      (function(){ var s=document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("width","20");s.setAttribute("height","20");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("aria-hidden","true");s.innerHTML='<path d="M12 3l10 18H2z" fill="none" stroke="#A8261A" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18h.01" stroke="#A8261A" stroke-width="2" stroke-linecap="round"/>';return s;})(),
      el("p",{},[el("strong",{text:"踩坑提醒"}),document.createTextNode(text)])
    ]);
  }
  function answerBlock(c){
    var box=el("div",{class:"ans"},[
      el("div",{},[el("div",{class:"sec-l",text:"参考答案"}),el("div",{class:"atext",text:c.a})]),
      c.k? el("div",{},[el("div",{class:"sec-l",text:"要点"}),el("div",{class:"keys"},c.k.map(function(x){return el("span",{text:x});}))]) : null,
      c.e? el("div",{class:"eg"},[el("div",{class:"sec-l",text:P[c.eg]}),el("p",{text:c.e})]) : null,
      c.t? trapBox(c.t) : null
    ]);
    return box;
  }
  function cardEl(c, open){
    var m=mod(c.m);
    var card=el("article",{class:"qcard",style:"--accent:"+acc(m)+";--tint:"+tint(m)},[
      el("div",{class:"qhead"},[el("div",{class:"qlabel",text:"客户问"}),el("h2",{class:"qtext",text:c.q})])
    ]);
    var ans=answerBlock(c); ans.id="ans-"+C.indexOf(c);
    if(open){ card.appendChild(ans); return card; }
    var btn=el("button",{class:"reveal",type:"button","aria-expanded":"false","aria-controls":ans.id,text:"先想一想，再点这里看参考答案"});
    ans.hidden=true;
    btn.addEventListener("click",function(){ ans.hidden=false; btn.hidden=true; btn.setAttribute("aria-expanded","true"); seen[C.indexOf(c)]=true; });
    card.appendChild(btn); card.appendChild(ans);
    if(seen[C.indexOf(c)]){ ans.hidden=false; btn.hidden=true; }
    return card;
  }

  /* ---------- 小测 ---------- */
  function quizItem(item, n, onDone){
    var box=el("div",{class:"qq"},[el("h3",{},[el("span",{text:String(n)}),document.createTextNode(item.q)])]);
    var opts=[];
    item.o.forEach(function(o,j){
      var b=el("button",{class:"opt",type:"button"},[el("b",{text:"ABCD"[j]}),el("span",{text:o})]);
      b.addEventListener("click",function(){
        opts.forEach(function(x,k){ x.disabled=true; if(k===item.a) x.classList.add("right"); });
        var ok=j===item.a; if(!ok) b.classList.add("wrong");
        box.appendChild(el("div",{class:"expl"},[el("strong",{text:ok?"答对了。":"再想想。"}),document.createTextNode(item.x)]));
        if(onDone) onDone(ok);
      });
      opts.push(b); box.appendChild(b);
    });
    return box;
  }
  function quizEl(mid){
    var m=mod(mid), wrap=el("div",{class:"quiz",style:"--accent:"+acc(m)});
    wrap.appendChild(el("div",{class:"quiz-top"},[el("h2",{text:m.name+" · 小测"}),el("p",{text:"3 道题，选完马上看解析。"})]));
    var answered=0, total=Q[mid].length;
    Q[mid].forEach(function(it,i){ wrap.appendChild(quizItem(it,i+1,function(){
      answered++;
      if(answered===total){
        wrap.appendChild(el("div",{class:"finish"},[el("strong",{text:"✓ 本模块已完成"}),el("span",{text:"看完解析后，点「完成，返回首页」。"})]));
        markDone(mid); setChip(); setNext();
      }
    })); });
    return wrap;
  }

  /* ---------- 渲染当前位置 ---------- */
  function render(){
    var f=FLOW[pos], m=mod(f.m), stage=$("stage");
    stage.innerHTML="";
    setChip();
    $("chip").style.background=acc(m);
    var cards=[], ci=0;
    FLOW.forEach(function(x,i){ if(x.m===f.m && x.t==="card"){ cards.push(i); if(i===pos) ci=cards.length; } });
    var n=cards.length, step = f.t==="card" ? ci : n;
    var hasQ=!!Q[f.m], totalSteps=n+(hasQ?1:0), cur = f.t==="card" ? ci : totalSteps;
    var pct=Math.round(cur/totalSteps*100);
    $("prog").style.width=pct+"%"; $("progbar").setAttribute("aria-valuenow",String(pct));
    $("progbar").setAttribute("aria-label","本模块进度");
    $("count").textContent = f.t==="card" ? (ci+" / "+n) : "小测";
    if(f.t==="card"){
      stage.appendChild(cardEl(C[f.i],false));
      stage.appendChild(el("div",{class:"hint",text:"左右滑动切换卡片"}));
    } else stage.appendChild(quizEl(f.m));
    $("btn-prev").disabled = pos===0;
    var nx=FLOW[pos+1];
    setNext();
    save(); window.scrollTo(0,0);
  }
  function setNext(){
    var f=FLOW[pos], nx=FLOW[pos+1], last=!nx || nx.m!==f.m;
    var willFinish = last && (done[f.m] || !Q[f.m]);
    $("btn-next").textContent = willFinish ? "完成，返回首页" : (!nx ? "结业测验" : (nx.t==="quiz" ? "进入小测" : (f.t==="quiz" ? "下一模块" : "下一张")));
  }
  function updStart(){ $("btn-start").textContent = pos>0 ? "继续学习" : "开始学习"; }
  function setChip(){
    var f=FLOW[pos], m=mod(f.m);
    $("chip").textContent=m.no+" "+m.name+(done[f.m]?"  ✓ 已完成":"");
  }
  function go(d){
    if(!$("v-review").hidden || !$("v-home").hidden) return;
    if(finalMode){ return; }
    var n=pos+d;
    /* 没有小测的模块：读完最后一张卡往前走即算完成 */
    var leaving = d>0 && (!FLOW[n] || FLOW[n].m!==FLOW[pos].m);
    if(leaving && !Q[FLOW[pos].m]) markDone(FLOW[pos].m);
    if(leaving && done[FLOW[pos].m]){
      if(FLOW[n]){ pos=n; save(); }
      show("home"); updStart();
      var hm=$("home-mods"); if(hm && hm.scrollIntoView) setTimeout(function(){ hm.parentNode.scrollIntoView({behavior:"smooth",block:"start"}); },60);
      return;
    }
    if(n>=FLOW.length){ show("final"); return; }
    if(n<0) return;
    pos=n; render();
  }
  $("btn-prev").addEventListener("click",function(){ if(finalMode){ finalMode=false; show("learn"); } else go(-1); });
  $("btn-next").addEventListener("click",function(){ if(finalMode){ show("home"); finalMode=false; } else go(1); });
  var sx=0, sy=0;
  $("stage").addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  $("stage").addEventListener("touchend",function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0?1:-1);
  },{passive:true});
  document.addEventListener("keydown",function(e){
    if($("v-learn").hidden || !$("drawer").hidden) return;
    if(e.key==="ArrowRight") go(1); if(e.key==="ArrowLeft") go(-1);
  });

  /* ---------- 结业测验：从各模块小测中随机抽 10 题 ---------- */
  var finalMode=false;
  function renderFinal(){
    finalMode=true;
    var all=[]; for(var k in Q) Q[k].forEach(function(it){ all.push(it); });
    for(var i=all.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=all[i]; all[i]=all[j]; all[j]=t; }
    var pick=all.slice(0,10), done=0, right=0;
    var stage=$("stage"); stage.innerHTML="";
    $("chip").textContent="结业测验"; $("chip").style.background="var(--gold-deep)";
    $("prog").style.width="100%"; $("count").textContent="10 题";
    var wrap=el("div",{class:"quiz",style:"--accent:var(--gold-deep)"});
    wrap.appendChild(el("div",{class:"quiz-top"},[el("h2",{text:"结业测验"}),el("p",{text:"从各模块随机抽 10 题，答完显示得分。8 题或以上为通过。"})]));
    var result=el("div",{class:"score",hidden:""});
    pick.forEach(function(it,i){
      wrap.appendChild(quizItem(it,i+1,function(ok){
        done++; if(ok) right++;
        if(done===pick.length){
          result.innerHTML="";
          result.appendChild(el("p",{text:"你的得分"}));
          result.appendChild(el("strong",{text:right+" / 10"}));
          result.appendChild(el("p",{text: right>=8 ? "通过。可以开始在导师陪同下见客户。" : "未达 8 题。建议回到目录，重温答错题目所在的模块。"}));
          result.hidden=false; result.scrollIntoView({behavior:"smooth",block:"center"});
        }
      }));
    });
    wrap.appendChild(result);
    stage.appendChild(wrap);
    $("btn-prev").disabled=false; $("btn-prev").textContent="返回学习";
    $("btn-next").textContent="回到首页";
    window.scrollTo(0,0);
  }
  var _render=render; render=function(){ finalMode=false; $("btn-prev").textContent="上一张"; _render(); };

  /* ---------- 目录 ---------- */
  function closeDrawer(){ $("drawer").hidden=true; $("btn-menu").focus(); }
  $("btn-menu").addEventListener("click",function(){ $("drawer").hidden=false; $("btn-close").focus(); });
  $("btn-close").addEventListener("click",closeDrawer);
  $("drawer").addEventListener("click",function(e){ if(e.target===$("drawer")) closeDrawer(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && !$("drawer").hidden) closeDrawer(); });

  /* ---------- 审阅模式 ---------- */
  var reviewBuilt=false;
  function renderReview(){
    if(reviewBuilt) return; reviewBuilt=true;
    var r=$("review");
    r.appendChild(el("div",{class:"rv-head"},[
      el("h1",{text:"全部问答与答案"}),
      el("p",{text:"供审阅和修改用：所有答案已展开，小测正确答案以绿色标出。点右上角「复制全文」可复制文字稿。"})
    ]));
    M.forEach(function(m){
      var sec=el("section",{class:"rv-mod"},[el("h2",{},[el("span",{class:"no",style:"background:"+acc(m),text:m.no}),document.createTextNode(m.name)])]);
      C.forEach(function(c){ if(c.m===m.id){ var ce=cardEl(c,true); ce.classList.add("rv-card"); sec.appendChild(ce); } });
      if(Q[m.id]){
        var ol=el("ol");
        Q[m.id].forEach(function(it){
          ol.appendChild(el("li",{},[document.createTextNode(it.q+" "),el("span",{class:"ok",text:"答案："+"ABCD"[it.a]+". "+it.o[it.a]})]));
        });
        sec.appendChild(el("div",{class:"rv-quiz"},[el("strong",{text:"小测"}),ol]));
      }
      r.appendChild(sec);
    });
  }
  function plainText(){
    var out=["私行房产收益方案 · 问答特训（文字稿）",""];
    M.forEach(function(m){
      out.push("【"+m.no+" "+m.name+"】");
      C.forEach(function(c,i){ if(c.m!==m.id) return;
        out.push("","Q："+c.q,"A："+c.a);
        if(c.k) out.push("要点："+c.k.join(" / "));
        if(c.e) out.push(P[c.eg]+"：\n"+c.e);
        if(c.t) out.push("踩坑提醒："+c.t);
      });
      if(Q[m.id]){ out.push("","小测："); Q[m.id].forEach(function(it,i){ out.push((i+1)+". "+it.q+"  "+it.o.map(function(o,j){return "ABCD"[j]+"."+o;}).join("  ")+"  答案："+"ABCD"[it.a]); }); }
      out.push("");
    });
    return out.join("\n");
  }
  function toast(t){ var x=$("toast"); x.textContent=t; x.hidden=false; setTimeout(function(){ x.hidden=true; },2200); }
  $("btn-copy").addEventListener("click",function(){
    var t=plainText();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast("已复制全文"); },function(){ toast("复制失败，请在页面上长按选取文字"); });
    } else toast("此浏览器不支持复制，请长按选取文字");
  });

  /* 启动 */
  function route(){ if(location.hash==="#review") show("review"); }
  window.addEventListener("hashchange",route);
  route();
})();
</script>
</body>
