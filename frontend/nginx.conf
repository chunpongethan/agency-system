server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets (index-<hash>.js/.css, etc.) are immutable — a new
    # build produces new filenames, so these are safe to cache hard.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA entry point: never cache index.html, so a fresh deploy (which points at
    # new hashed bundles) is picked up on the next load instead of being pinned to
    # a stale bundle. Applies to direct hits and the SPA fallback below.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # SPA fallback: hash routing means every path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
