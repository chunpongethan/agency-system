# Production deployment on a single VM: Postgres + FastAPI + built frontend
# (nginx) behind Caddy, which terminates TLS with automatic Let's Encrypt certs.
#
# Prereqs on the VM: Docker + Compose, DNS A records for WEB_DOMAIN and API_DOMAIN
# pointing at the VM's public IP, and ports 80 + 443 open.
#
# Configure via a .env file next to this one (copy deploy/.env.example), then:
#     docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Only Caddy binds host ports; db/api/web are reachable only on the internal
# network. No demo data is loaded (SEED_DEMO=false); a single real admin is
# created from ADMIN_EMAIL / ADMIN_PASSWORD on first boot.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agency}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agency} -d ${POSTGRES_DB:-agency}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agency}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agency}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      # Production data policy: no demo data; bootstrap one real admin.
      SEED_DEMO: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_CODE: ${ADMIN_CODE:-A000}
      # Second company (CPM) admin — created only when these are set in .env.
      CPM_ADMIN_EMAIL: ${CPM_ADMIN_EMAIL:-}
      CPM_ADMIN_PASSWORD: ${CPM_ADMIN_PASSWORD:-}
      CPM_ADMIN_NAME: ${CPM_ADMIN_NAME:-CPM Administrator}
      CPM_ADMIN_CODE: ${CPM_ADMIN_CODE:-cpm000}
      # Lock CORS to the web origin.
      CORS_ORIGINS: https://${WEB_DOMAIN}
      # Password-reset email + link base URL.
      FRONTEND_URL: https://${WEB_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Public API origin, baked into the frontend bundle at build time.
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
