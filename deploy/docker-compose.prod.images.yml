# Lean production stack that PULLS prebuilt images (from GHCR) instead of
# building on the VM. Pair with the build-and-push GitHub Actions workflow.
#
# On the VM you only need three files: this file, Caddyfile, and .env.
#     docker compose -f docker-compose.prod.images.yml --env-file .env pull
#     docker compose -f docker-compose.prod.images.yml --env-file .env up -d
#
# Set IMAGE_PREFIX in .env, e.g. ghcr.io/chunpongethan/agency-system
# If the GHCR packages are private, run first:
#     echo "$GHCR_TOKEN" | docker login ghcr.io -u <github-user> --password-stdin

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agency}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agency} -d ${POSTGRES_DB:-agency}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agency}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agency}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      SEED_DEMO: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_CODE: ${ADMIN_CODE:-A000}
      CORS_ORIGINS: https://${WEB_DOMAIN}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
